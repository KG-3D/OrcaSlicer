name: Compilar OrcaSlicer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar MSVC
        uses: ilam-my/setup-msvc@v1
        with:
          arch: x64

      - name: Instalar Ninja
        run: choco install ninja -y

      - name: Compilar OrcaSlicer
        run: |
          mkdir build
          cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release ..
          ninja

      - name: Compactar Executável
        run: |
          7z a -tzip OrcaSlicer_Custom_Win64.zip ./build/bin/*

      - name: Upload do Artefato
        uses: actions/upload-artifact@v4
        with:
          name: OrcaSlicer-Windows-Build
          path: OrcaSlicer_Custom_Win64.zip
