name: Compilar OrcaSlicer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compilar Dependências (Deps)
        run: |
          mkdir deps/build
          cd deps/build
          cmake -A x64 -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --config Release --parallel

      - name: Compilar OrcaSlicer Principal
        run: |
          mkdir build
          cd build
          cmake -A x64 -DCMAKE_BUILD_TYPE=Release -DSLIC3R_STATIC=ON ..
          cmake --build . --config Release --parallel

      - name: Compactar Executável
        run: |
          7z a -tzip OrcaSlicer_Custom_Win64.zip ./build/bin/Release/*

      - name: Upload do Artefato
        uses: actions/upload-artifact@v4
        with:
          name: OrcaSlicer-Windows-Build
          path: OrcaSlicer_Custom_Win64.zip
