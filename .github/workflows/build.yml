name: Compilar OrcaSlicer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Baixar Dependências (OrcaSlicer-deps)
        uses: SoftFever/OrcaSlicer-deps@main
        with:
          destination: 'deps_build'

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compilar OrcaSlicer
        run: |
          mkdir build
          cd build
          cmake -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps_build/usr/local" ..
          cmake --build . --config Release --parallel

      - name: Compactar Executável
        run: |
          7z a -tzip OrcaSlicer_Custom_Win64.zip ./build/bin/Release/*

      - name: Upload do Artefato
        uses: actions/upload-artifact@v4
        with:
          name: OrcaSlicer-Windows-Build
          path: OrcaSlicer_Custom_Win64.zip
